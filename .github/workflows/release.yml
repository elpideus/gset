# Publishes a release when a v* tag is pushed (`node scripts/release.mjs <version>` pushes one): the
# checks from ci.yml, then the AppImage, .deb and .rpm (with the gset launcher inside) and the bare
# launcher, built on one runner, signed by a job of its own, and published as a GitHub release with
# latest.json, which installed copies read to update themselves, and SHA256SUMS. A tag with a "-"
# (v0.3.0-beta.1) is published as a pre-release, which installed copies do not update to.
#
# Run by hand (Actions, Release, Run workflow), it builds everything from the chosen ref and keeps
# it as workflow artifacts, unsigned, publishing nothing: builds to try. The signing key is for
# releases only.
#
# Every action is pinned to a commit, with its tag in a comment: a tag can be moved to other code,
# a commit cannot.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time, and never cancelled halfway through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag is published only once CI's checks pass on it. A build by hand skips them: it publishes
  # nothing, and whoever starts it wants the files soon.
  checks:
    name: Checks
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  # Built on the oldest system with WebKitGTK 4.1 the release is meant for, Ubuntu 22.04, so the
  # binaries ask for no newer glibc than it has. The build never sees the signing key: it runs the
  # build scripts of every dependency, so the key is used on another runner, in the sign job.
  linux:
    name: Build for Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file patchelf xdg-utils libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev librsvg2-dev libdbus-1-dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: app/package.json
          cache: true
          cache_dependency_path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release
          # A cache saved on a tag serves only that tag. A test build on main saves one the next
          # tag starts from.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: The tag matches the version in the repository
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/version.mjs --check "$GITHUB_REF_NAME"

      - name: Version
        id: version
        run: echo "version=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile

      # beforeBuildCommand builds the launcher first (scripts/sidecar.mjs), then the page
      - name: Build
        working-directory: app
        run: pnpm tauri build --bundles deb,rpm,appimage

      # Names without the version, so the README's download links always reach the newest one,
      # and an AppImage that has updated itself doesn't carry an old version in its name.
      - name: Collect the packages
        run: |
          mkdir -p out
          bundle=target/release/bundle
          cp "$bundle"/appimage/*.AppImage out/GSet-x86_64.AppImage
          cp "$bundle"/deb/*.deb out/gset_amd64.deb
          cp "$bundle"/rpm/*.rpm out/gset.x86_64.rpm
          cp target/release/gset out/gset-x86_64-linux
          sha256sum out/* | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gset-${{ steps.version.outputs.version }}-linux-unsigned
          path: out/
          if-no-files-found: error
          # Running the jobs again replaces the artifact instead of failing on it.
          overwrite: true

  # Signs the builds as they were made, on a fresh runner: nothing checked out, nothing installed
  # or restored from a cache, no token permissions. The updater signatures come from the tauri CLI,
  # bound to the version. This keeps the key out of reach of code that ran in the build.
  sign:
    name: Sign
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    environment: release
    env:
      VERSION: ${{ needs.linux.outputs.version }}
      TAURI_CLI_VERSION: 2.12.4
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gset-${{ needs.linux.outputs.version }}-linux-unsigned
          path: release

      - name: Sign the updates
        # The signer waits for a password on the console when it has none.
        timeout-minutes: 5
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          npm_config_ignore_scripts: 'true'
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The release environment has no TAURI_SIGNING_PRIVATE_KEY secret."
            exit 1
          fi
          dir="$GITHUB_WORKSPACE/release"
          cd "$(mktemp -d)"
          for file in GSet-x86_64.AppImage gset_amd64.deb gset.x86_64.rpm; do
            npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" signer sign --app-version "$VERSION" "$dir/$file" < /dev/null
          done

      - name: Check the signatures
        run: |
          for file in GSet-x86_64.AppImage gset_amd64.deb gset.x86_64.rpm; do
            if [ ! -s "release/$file.sig" ]; then
              echo "::error::$file.sig is missing or empty: $file is not signed."
              exit 1
            fi
          done
          ls -l release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gset-${{ needs.linux.outputs.version }}-signed
          path: release/
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish the release
    if: github.event_name == 'push'
    needs: [checks, linux, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.linux.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gset-${{ needs.linux.outputs.version }}-signed
          path: assets

      # Installed apps read releases without signing in: from a private repository they get 404.
      - name: The repository is public
        run: |
          visibility=$(gh repo view "$GH_REPO" --json visibility --jq .visibility)
          if [ "$visibility" != PUBLIC ]; then
            echo "::error::$GH_REPO is $visibility: installed apps could not read this release."
            exit 1
          fi

      - name: Release notes and the update manifest
        run: |
          node scripts/release-notes.mjs "$TAG" > release-notes.md
          node scripts/release-notes.mjs "$TAG" --changes > changes.md
          node scripts/updater-manifest.mjs "$VERSION" assets changes.md > assets/latest.json
          cat assets/latest.json

      - name: Checksums
        run: |
          cd assets
          sha256sum GSet-x86_64.AppImage gset_amd64.deb gset.x86_64.rpm gset-x86_64-linux > SHA256SUMS
          tee -a "$GITHUB_STEP_SUMMARY" < SHA256SUMS

      # Publishing again (a re-run) replaces the release's files and notes instead of failing.
      - name: Publish
        run: |
          files=(assets/*)
          if [[ "$TAG" == *-* ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--prerelease=false --latest)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "GSet $VERSION" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "GSet $VERSION" \
              --notes-file release-notes.md "${flags[@]}"
          fi
